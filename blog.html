<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Code A-Z</title>
<meta name="description" content="Articles sur le développement web, la performance et le design d'interface, écrits par Agnissan Isaac (Code A-Z).">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
<style>
  .blog-hero{ max-width:760px; margin:0 auto; padding:90px 32px 60px; }
  .blog-hero h1{ font-size:clamp(2.2rem,5vw,3.4rem); margin-top:16px; }
  .blog-hero p{ margin-top:20px; font-size:1.05rem; max-width:520px; }
  .blog-controls{ display:flex; gap:14px; align-items:center; margin-bottom:40px; flex-wrap:wrap; }
  .search-input{
    flex:1; min-width:220px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-full); padding:12px 20px; font-family:'Inter',sans-serif;
    font-size:13.5px; color:var(--text);
  }
  .search-input:focus{ outline:none; border-color:var(--accent); }
  .tag-filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .tag-filter-btn{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; padding:9px 16px;
    border-radius:var(--radius-full); border:1px solid var(--line); background:var(--surface);
    color:var(--muted); transition:all .2s ease; white-space:nowrap;
  }
  .tag-filter-btn:hover{ border-color:var(--muted-2); color:var(--text); }
  .tag-filter-btn.active{ background:var(--text); color:var(--bg); border-color:var(--text); }

  .featured-post{
    display:grid; grid-template-columns:1.1fr 1fr; gap:36px; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    overflow:hidden; text-decoration:none; margin-bottom:48px;
  }
  @media (max-width:760px){ .featured-post{ grid-template-columns:1fr; } }
  .featured-post .cover{ aspect-ratio:16/11; overflow:hidden; }
  .featured-post .cover img{ width:100%; height:100%; object-fit:cover; }
  .featured-post .body{ padding:12px 36px 12px 0; }
  @media (max-width:760px){ .featured-post .body{ padding:28px 26px 34px; } }
  .featured-post .label{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:14px; }
  .featured-post h2{ font-size:1.7rem; color:var(--text); margin-bottom:14px; line-height:1.2; }
  .featured-post p{ font-size:14.5px; line-height:1.7; margin-bottom:18px; }
  .featured-post .meta{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted-2); }

  .post-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:28px; }
  @media (max-width:760px){ .post-grid{ grid-template-columns:1fr; } }
  .post-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    overflow:hidden; text-decoration:none; display:flex; flex-direction:column;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .post-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-md); }
  .post-card .cover{ aspect-ratio:16/9; background:var(--line); overflow:hidden; }
  .post-card .cover img{ width:100%; height:100%; object-fit:cover; }
  .post-card .body{ padding:24px 26px 28px; }
  .post-card .meta{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted-2); margin-bottom:12px; display:flex; gap:12px; }
  .post-card h3{ color:var(--text); font-size:1.25rem; margin-bottom:10px; }
  .post-card p{ font-size:14px; line-height:1.6; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); font-size:14.5px; }

  /* ---------- Bouton retour en haut ---------- */
.back-to-top{
  position:fixed; bottom:28px; right:28px; width:44px; height:44px; border-radius:50%;
  background:var(--text); color:var(--bg); border:none; display:flex; align-items:center; justify-content:center;
  cursor:pointer; opacity:0; pointer-events:none; transform:translateY(10px);
  transition:opacity .25s ease, transform .25s ease, background .2s ease; z-index:90;
  box-shadow:var(--shadow-md);
}
.back-to-top.visible{ opacity:1; pointer-events:auto; transform:translateY(0); }
.back-to-top:hover{ background:var(--accent); }
.back-to-top svg{ width:18px; height:18px; }
</style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html#hero" class="logo">
    <img src="images/Code_A-Z_Logo-no-bg.png" alt="Code A-Z">
  </a>
  <div class="nav-links">
    <a href="index.html#about">À propos</a>
    <a href="index.html#portfolio">Portfolio</a>
    <a href="blog.html" class="active">Blog</a>
    <a href="index.html#contact">Contact</a>
  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème">
    <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
</nav>

<div class="blog-hero">
  <div class="eyebrow"><span class="dot"></span>Blog</div>
  <h1>Notes sur le web, la performance et le design.</h1>
  <p>Des articles courts, publiés régulièrement, sur ce que j'apprends en construisant des sites.</p>
</div>

<div class="container">
  <div class="blog-controls">
    <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un article...">
    <div class="tag-filters" id="tagFilters"></div>
  </div>
  <div id="featuredSlot"></div>
  <div class="post-grid" id="postGrid">
    <div class="skeleton-card"><div class="thumb"></div><div class="body"><div class="skeleton-line w-40"></div><div class="skeleton-line w-90"></div><div class="skeleton-line w-60"></div></div></div>
    <div class="skeleton-card"><div class="thumb"></div><div class="body"><div class="skeleton-line w-40"></div><div class="skeleton-line w-90"></div><div class="skeleton-line w-60"></div></div></div>
  </div>
  <p class="empty-state" id="emptyState" style="display:none;">Aucun article ne correspond à votre recherche.</p>
</div>

<footer>
  <div class="container footer-bottom">
    <span>&copy; 2026 Code A-Z. Tous droits réservés.</span>
    <a href="index.html#contact">Discuter d'un projet →</a>
  </div>
</footer>

<script>
  const themeToggle = document.getElementById('themeToggle');
  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
    });
  }

  let ALL_POSTS = [];
  let activeTag = 'all';

  function renderPosts() {
    const grid = document.getElementById('postGrid');
    const empty = document.getElementById('emptyState');
    const featuredSlot = document.getElementById('featuredSlot');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();

    let posts = ALL_POSTS;
    let featured = null;

    if (activeTag === 'all' && !query) {
      featured = posts[0];
      posts = posts.slice(1);
    }

    if (activeTag !== 'all') {
      posts = posts.filter(p => p.tags && p.tags.includes(activeTag));
    }
    if (query) {
      posts = posts.filter(p => p.title.toLowerCase().includes(query));
    }

    featuredSlot.innerHTML = featured ? `
      <a href="blog/${featured.slug}.html" class="featured-post">
        ${featured.cover ? `<div class="cover"><img src="${featured.cover}" alt="${featured.title}" loading="lazy"></div>` : ''}
        <div class="body">
          <div class="label">Dernier article</div>
          <h2>${featured.title}</h2>
          <p>${featured.excerpt}</p>
          <div class="meta">${featured.dateLabel}</div>
        </div>
      </a>
    ` : '';

    if (!posts.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      grid.innerHTML = posts.map(p => `
        <a href="blog/${p.slug}.html" class="post-card">
          ${p.cover ? `<div class="cover"><img src="${p.cover}" alt="${p.title}" loading="lazy"></div>` : ''}
          <div class="body">
            <div class="meta"><span>${p.dateLabel}</span></div>
            <h3>${p.title}</h3>
            <p>${p.excerpt}</p>
          </div>
        </a>
      `).join('');
    }
  }

  fetch('blog/posts.json')
    .then(r => r.ok ? r.json() : [])
    .then(posts => {
      ALL_POSTS = posts;
      if (!posts.length) { document.getElementById('emptyState').style.display = 'block'; return; }

      const allTags = [...new Set(posts.flatMap(p => p.tags || []))];
      const tagFilters = document.getElementById('tagFilters');
      tagFilters.innerHTML = `<button class="tag-filter-btn active" data-tag="all">Tous les sujets</button>` +
        allTags.map(t => `<button class="tag-filter-btn" data-tag="${t}">${t}</button>`).join('');

      tagFilters.querySelectorAll('.tag-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          tagFilters.querySelectorAll('.tag-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeTag = btn.dataset.tag;
          renderPosts();
        });
      });

      document.getElementById('searchInput').addEventListener('input', renderPosts);

      renderPosts();
    })
    .catch(() => { document.getElementById('emptyState').style.display = 'block'; });

    /* ---------- Bouton retour en haut ---------- */
  const backToTop = document.createElement('button');
  backToTop.className = 'back-to-top';
  backToTop.setAttribute('aria-label', 'Retour en haut de page');
  backToTop.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  document.body.appendChild(backToTop);
  window.addEventListener('scroll', () => {
    backToTop.classList.toggle('visible', window.scrollY > 500);
  });
  backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
</script>

</body>
</html>
