		*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

		.video-bg {

		}

		.overlay-scanlines {
			position: fixed;
			inset: 0;
			z-index: 1;
			background: repeating-linear-gradient(

				transparent 2px,
				rgba(0,0,0,0.18) 2px,
				rgba(0,0,0,0.18) 4px
			);
			pointer-events: none;
		}
		.overlay-vignette {
			position: fixed;
			inset: 0;
			z-index: 2;
			background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
			pointer-events: none;
		}
		.overlay-red-line {
			position: fixed;
			top: 0; left: 0; right: 0;
			height: 3px;
			background: var(--red);
			z-index: 10;
			box-shadow: 0 0 12px rgba(220,53,69,0.8);
		}
 
		.content {
			position: relative;
			z-index: 5;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 2rem;
			text-align: center;
		}
 
		.error-label {
			font-family: 'Share Tech Mono', monospace;
			font-size: 0.75rem;
			letter-spacing: 0.3em;
			color: var(--red);
			text-transform: uppercase;
			margin-bottom: 1.5rem;
			opacity: 0;
			animation: fadeSlideUp 0.6s ease forwards 0.3s;
		}
 
		.glitch-wrapper {
			position: relative;
			margin-bottom: 1rem;
			opacity: 0;
			animation: fadeSlideUp 0.6s ease forwards 0.5s;
		}
 
		.glitch {
			font-size: clamp(7rem, 22vw, 15rem);
			font-weight: 900;
			line-height: 1;
			color: var(--white);
			letter-spacing: -0.04em;
			position: relative;
			display: inline-block;
		}
		.glitch::before,
		.glitch::after {
			content: attr(data-text);
			position: absolute;
			inset: 0;
			font-size: inherit;
			font-weight: inherit;
			letter-spacing: inherit;
		}
		.glitch::before {
			color: var(--red);
			clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
			animation: glitch-top 3s infinite steps(1);
		}
		.glitch::after {
			color: #00e5ff;
			clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
			animation: glitch-bot 3s infinite steps(1);
			opacity: 0.6;
		}
 
		.divider {
			width: 60px;
			height: 2px;
			background: var(--red);
			margin: 0 auto 1.5rem;
			opacity: 0;
			animation: fadeSlideUp 0.6s ease forwards 0.7s;
		}
 
		.headline {
			font-size: clamp(1.1rem, 3vw, 1.5rem);
			font-weight: 700;
			letter-spacing: 0.05em;
			text-transform: uppercase;
			color: var(--white);
			margin-bottom: 0.75rem;
			opacity: 0;
			animation: fadeSlideUp 0.6s ease forwards 0.8s;
		}
 
		.subtext {
			font-family: 'Share Tech Mono', monospace;
			font-size: 0.8rem;
			color: rgba(240,240,240,0.45);
			letter-spacing: 0.15em;
			margin-bottom: 2.5rem;
			opacity: 0;
			animation: fadeSlideUp 0.6s ease forwards 0.95s;
		}
 
		/* ── NAV DROPDOWN ── */
		.nav-wrapper {
			position: relative;
			opacity: 0;
			animation: fadeSlideUp 0.6s ease forwards 1.1s;
		}
 
		.btn-home {
			display: inline-flex;
			align-items: center;
			gap: 0.6rem;
			padding: 0.8rem 2.2rem;
			background: var(--red);
			color: #fff;
			font-family: 'Space Grotesk', sans-serif;
			font-weight: 700;
			font-size: 0.85rem;
			letter-spacing: 0.15em;
			text-transform: uppercase;
			text-decoration: none;
			border: none;
			cursor: pointer;
			clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
			transition: background 0.2s;
			position: relative;
			z-index: 2;
		}
		.btn-home:hover { background: var(--red-dark); }
		.btn-home svg { width: 15px; height: 15px; transition: transform 0.3s ease; }
		.btn-home.open svg { transform: rotate(180deg); }
 
		/* ── MENU ── */
		.nav-menu {
			position: absolute;
			bottom: calc(100% + 10px);
			left: 50%;
			transform: translateX(-50%) translateY(8px);
			background: rgba(8,8,8,0.96);
			border: 1px solid rgba(220,53,69,0.35);
			width: 260px;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.25s ease, transform 0.25s ease;
			z-index: 20;
		}
		.nav-menu.visible {
			opacity: 1;
			pointer-events: all;
			transform: translateX(-50%) translateY(0);
		}
 
		.nav-menu-header {
			font-family: 'Share Tech Mono', monospace;
			font-size: 0.6rem;
			letter-spacing: 0.3em;
			color: var(--red);
			padding: 0.7rem 1rem 0.5rem;
			border-bottom: 1px solid rgba(220,53,69,0.2);
			text-transform: uppercase;
		}
 
		.nav-menu a {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			padding: 0.65rem 1rem;
			color: rgba(240,240,240,0.7);
			text-decoration: none;
			font-family: 'Share Tech Mono', monospace;
			font-size: 0.78rem;
			letter-spacing: 0.12em;
			border-bottom: 1px solid rgba(255,255,255,0.04);
			transition: color 0.15s, background 0.15s, padding-left 0.15s;
		}
		.nav-menu a:last-child { border-bottom: none; }
		.nav-menu a:hover {
			color: var(--white);
			background: rgba(220,53,69,0.1);
			padding-left: 1.4rem;
		}
		.nav-menu a .nav-index {
			font-size: 0.55rem;
			color: var(--red);
			min-width: 18px;
		}
 
		/* ── CORNERS ── */
		.corner {
			position: fixed;
			width: 30px; height: 30px;
			z-index: 5;
			opacity: 0;
			animation: fadeIn 1s ease forwards 1.5s;
		}
		.corner--tl { top: 1.2rem; left: 1.2rem; border-top: 1px solid var(--red); border-left: 1px solid var(--red); }
		.corner--tr { top: 1.2rem; right: 1.2rem; border-top: 1px solid var(--red); border-right: 1px solid var(--red); }
		.corner--bl { bottom: 1.2rem; left: 1.2rem; border-bottom: 1px solid var(--red); border-left: 1px solid var(--red); }
		.corner--br { bottom: 1.2rem; right: 1.2rem; border-bottom: 1px solid var(--red); border-right: 1px solid var(--red); }
 
		/* ── FOOTER ── */
		.footer {
			position: fixed;
			bottom: 1.5rem;
			left: 0; right: 0;
			text-align: center;
			font-family: 'Share Tech Mono', monospace;
			font-size: 0.65rem;
			letter-spacing: 0.2em;
			color: rgba(240,240,240,0.2);
			z-index: 5;
			opacity: 0;
			animation: fadeSlideUp 0.6s ease forwards 1.3s;
		}
 
		/* ── KEYFRAMES ── */
		@keyframes fadeSlideUp {
			from { opacity: 0; transform: translateY(16px); }
			to   { opacity: 1; transform: translateY(0); }
		}
		@keyframes fadeIn {
			from { opacity: 0; } to { opacity: 1; }
		}
		@keyframes glitch-top {
			0%,100% { transform: translate(0); }
			10%      { transform: translate(-3px, -2px); }
			20%      { transform: translate(3px, 0); }
			30%      { transform: translate(-2px, -1px); }
			40%,90%  { transform: translate(0); }
		}
		@keyframes glitch-bot {
			0%,100% { transform: translate(0); }
			15%     { transform: translate(3px, 2px); }
			25%     { transform: translate(-3px, 1px); }
			35%     { transform: translate(2px, 0); }
			45%,85% { transform: translate(0); }
		}
 
		@media (max-width: 480px) {
			.subtext { font-size: 0.7rem; letter-spacing: 0.08em; }
			.nav-menu { width: 220px; }
		}
	</style>

	<script>
		const btn = document.getElementById('navBtn');
		const menu = document.getElementById('navMenu');
 
		btn.addEventListener('click', function(e) {
			e.stopPropagation();
			const isOpen = menu.classList.toggle('visible');
			btn.classList.toggle('open', isOpen);
			btn.setAttribute('aria-expanded', isOpen);
		});
 
		document.addEventListener('click', function() {
			menu.classList.remove('visible');
			btn.classList.remove('open');
			btn.setAttribute('aria-expanded', 'false');
		});
 
		document.addEventListener('keydown', function(e) {
			if (e.key === 'Escape') {
				menu.classList.remove('visible');
				btn.classList.remove('open');
				btn.setAttribute('aria-expanded', 'false');
			}
		});
	</script>
