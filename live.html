<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Coupe du Monde 2026 | Code A-Z Foot Live</title>
    <meta name="description" content="Suivez le match en direct HD. Une exclusivité Code A-Z : Expertise informatique et passion foot.">
    <style>
        /* 1. Le reset indispensable pour éviter les débordements (overflow) */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            font-family: sans-serif; 
            background: #0f0f0f; 
            color: white; 
            overflow-x: hidden; /* Empêche le scroll horizontal */
        }

        .header { 
            text-align: center; 
            padding: 20px; 
            background: #1a1a1a; 
        }

        .main-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            padding: 20px; 
            max-width: 1400px; /* Limite la largeur sur les très grands écrans */
            margin: 0 auto;
        }

        .video-box { 
            flex: 2; 
            min-width: 0; /* Permet au flexbox de rétrécir en dessous du contenu si besoin */
            width: 100%; 
        }

        .sidebar { 
            flex: 1; 
            min-width: 300px; 
            background: #222; 
            padding: 20px; 
            border-radius: 8px; /* Petite touche moderne */
        }

        /* 2. Rendre l'iframe 100% responsive avec un ratio 16:9 parfait */
        iframe { 
            width: 100%; 
            aspect-ratio: 16 / 9; /* Remplace les hauteurs fixes (800px/250px) */
            border: 3px solid #ff0000; 
            border-radius: 8px;
            display: block;
        }

        .cta-button {
            display: block;
            background: #ff0000;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            transition: 0.3s ease;
            margin: 15px 0;
        }

        .cta-button:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        .ads-banner img {
            width: 100%;
            height: auto; /* Garde les proportions de l'image */
            border-radius: 5px;
        }

        /* =========================================
        📱 RESPONSIVE DESIGN (MOBILE & TABLETTE)
        ========================================= */
        @media screen and (max-width: 900px) {
            .main-container {
                flex-direction: column; /* Force les éléments à s'empiler */
                padding: 10px;
                gap: 15px;
            }

            .sidebar {
                min-width: 100%; /* La sidebar prend toute la largeur */
            }

            iframe {
                border-width: 2px; /* Affine la bordure sur mobile */
            }

            .header {
                padding: 15px 10px;
            }

            .header h1 {
                font-size: 1.2rem; 
            }
            
            .sidebar h3 {
                font-size: 1.1rem;
            }
        }

        .live-counter-badge {
            background: rgba(15, 15, 15, 0.85);
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            }

            .live-dot {
            color: #ff0000;
            margin-right: 8px;
            font-size: 18px;
            animation: blink 1.2s infinite;
            }

            @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
            }
    </style>
</head>
<body>
    <div class="header">
        <h1>Canada vs Bosnie-Herzégovine</h1>
        <br>
        <p>Live HD Offerte par Code A-Z</p>
    </div>

    <div class="main-container">
        <div class="video-box">

            <!-- Badge de Preuve Sociale (Spectateurs) -->
            <div class="live-counter-badge">
                <span class="live-dot">●</span> 
                <span id="visitor-count">5 852 </span> &nbsp; spectateurs en direct
            </div>

            <script>
                function simulateLiveTraffic() {
                    const counterElement = document.getElementById('visitor-count');
                    // Récupère le nombre actuel sans les espaces
                    let currentCount = parseInt(counterElement.innerText.replace(/\s/g, ''));
                    
                    // Génère une variation aléatoire entre -15 et +18 spectateurs
                    let variation = Math.floor(Math.random() * 50) - 100; 
                    currentCount += variation;

                    // Sécurité pour ne pas descendre trop bas si le live cartonne
                    if (currentCount < 5500) currentCount = 5800; // Minimum confortable
                    if (currentCount > 180500) currentCount = 180200; // Maximum crédible

                    // Affiche le nombre avec un espace pour les milliers (ex: 1 450)
                    counterElement.innerText = currentCount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
                }

                // Met à jour le compteur toutes les 4 secondes
                setInterval(simulateLiveTraffic, 4000);
            </script>



            <!-- iframe pour la vidéo -->
            <iframe src="https://jack07eo.mpstickv5m73jgravity.my/fr/football/fifa-world-cup-4331450/canada-vs-bosnia-and-herzegovina.html?icg=Q0k&ilang=fr" allowfullscreen 
                    sandbox="allow-scripts allow-same-origin"></iframe>
        </div>

        <div class="sidebar">
            <h3>Boostez votre business avec Code A-Z</h3>
            <p>Besoin d'un site web ? Appelez l'expert.</p>
            <a href="https://agnissanisaac.com" class="cta-button">Voir nos services</a>
            <div class="ads-banner">
                <img src="banniere-pub.jpg" alt="Pub Faites de la pub sur mesure car ici tout le monde vous voit!">
            </div>
        </div>
    </div>
</body>
</html>
