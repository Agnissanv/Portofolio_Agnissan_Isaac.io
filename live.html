<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Coupe du Monde 2026 | Code A-Z Foot Live</title>
    <meta name="description" content="Suivez le match en direct HD. Une exclusivité Code A-Z : Expertise informatique et passion foot.">
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: white; margin: 0; }
        .header { text-align: center; padding: 20px; background: #1a1a1a; }
        .main-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .video-box { flex: 2; min-width: 600px; }
        .sidebar { flex: 1; min-width: 300px; background: #222; padding: 15px; }
        iframe { width: 100%; height: 500px; border: 3px solid #ff0000; }

        .cta-button {
            display: block;
            background: #ff0000;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            transition: 0.3s ease;
            margin-bottom: 20px;
        }
        .cta-button:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        /* =========================================
        📱 RESPONSIVE DESIGN (MOBILE & TABLETTE)
        ========================================= */
        @media screen and (max-width: 768px) {
            .main-container {
                padding: 10px; /* Gagne de l'espace sur les petits écrans */
                gap: 15px;
            }

            .video-box {
                min-width: 100%; /* Casse la limite des 600px pour rentrer dans l'écran */
                flex: none; /* Désactive le flex proportionnel pour forcer le 100% */
            }

            .sidebar {
                min-width: 100%; /* La publicité passe parfaitement sous la vidéo */
                flex: none;
            }

            iframe {
                height: 250px; /* Adapte la hauteur pour un ratio 16:9 parfait sur mobile */
                border-width: 2px; /* Affine la ligne rouge pour ne pas étouffer l'image */
            }

            .header {
                padding: 15px 10px;
            }

            .header h1 {
                font-size: 1.2rem; /* Évite que le titre prenne la moitié de l'écran */
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Canada vs Bosnie-Herzégovine - Live HD</h1>
    </div>

    <div class="main-container">
        <!-- Zone Vidéo Sécurisée -->
        <div class="video-box">
            <iframe src="https://jack07eo.mpstickv5m73jgravity.my/fr/football/fifa-world-cup-4331450/canada-vs-bosnia-and-herzegovina.html?icg=Q0k&ilang=fr" allowfullscreen 
                    sandbox="allow-scripts allow-same-origin"></iframe>
        </div>

        <!-- Zone Publicitaire / Code A-Z -->
        <div class="sidebar">
            <h3>Boostez votre business avec Code A-Z</h3>
            <p>Besoin d'un site web ? Appelez l'expert.</p>
            <a href="https://agnissanisaac.com" class="cta-button" style="background:red; color:white; padding:10px;">Voir nos services</a>
            <div class="ads-banner">

                <img src="banniere-pub.jpg" alt="Pub Faites de la pub sur mesure car ici tout le monde vous voit! " style="width:100%;">

    </div>
</body>
</html>
